<svg xmlns="http://www.w3.org/2000/svg" width="680" height="800" viewBox="0 0 680 800" font-family="Microsoft YaHei, PingFang SC, Segoe UI, sans-serif">
  <defs>
    <marker id="ar-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="ar-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
    <marker id="ar-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="ar-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="800" fill="#ffffff"/>

  <text x="24" y="30" font-size="15" font-weight="700" fill="#0f172a">Task 1 数仓分层关系图 · 表为节点，SQL 脚本为连线</text>
  <text x="24" y="50" font-size="10.5" fill="#64748b">DIM / DWD / DWS 三层，刻意不建 ADS（理由见 design.md §1.3）；箭头 = 哪段 SQL 生产了哪张表</text>

  <!-- ========== ODS ========== -->
  <rect x="36" y="64" width="632" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="656" y="82" font-size="9.5" fill="#94a3b8" text-anchor="end" font-weight="600">ODS 贴源层</text>
  <rect x="250" y="88" width="180" height="46" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="340" y="106" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">ods_sales_seed</text>
  <text x="340" y="122" font-size="9" fill="#64748b" text-anchor="middle">样例销售数据.xlsx · 300 行</text>

  <!-- ========== DIM ========== -->
  <rect x="36" y="180" width="632" height="112" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="656" y="198" font-size="9.5" fill="#3b82f6" text-anchor="end" font-weight="600">DIM 维度层</text>

  <rect x="48" y="206" width="200" height="74" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="148" y="225" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">dim_product</text>
  <text x="148" y="241" font-size="8.5" fill="#475569" text-anchor="middle">product_id PK</text>
  <text x="148" y="254" font-size="8.5" fill="#475569" text-anchor="middle">tag_status: core/gray/excluded</text>
  <text x="148" y="270" font-size="8.5" fill="#2563eb" text-anchor="middle">30 个商品</text>

  <rect x="256" y="206" width="200" height="74" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="356" y="225" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">dim_title_alias</text>
  <text x="356" y="241" font-size="8.5" fill="#475569" text-anchor="middle">title_norm → product_id</text>
  <text x="356" y="254" font-size="8.5" fill="#475569" text-anchor="middle">raw_sample 便于审计</text>
  <text x="356" y="270" font-size="8.5" fill="#2563eb" text-anchor="middle">37 种标题写法</text>

  <rect x="464" y="206" width="190" height="74" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.3"/>
  <text x="559" y="225" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">dim_platform</text>
  <text x="559" y="241" font-size="8.5" fill="#475569" text-anchor="middle">platform_name PK</text>
  <text x="559" y="254" font-size="8.5" fill="#475569" text-anchor="middle">website / app / marketplace</text>
  <text x="559" y="270" font-size="8.5" fill="#2563eb" text-anchor="middle">3 个平台</text>

  <!-- ========== DWD ========== -->
  <rect x="36" y="322" width="632" height="112" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="656" y="340" font-size="9.5" fill="#059669" text-anchor="end" font-weight="600">DWD 明细层</text>

  <rect x="250" y="342" width="300" height="74" rx="6" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="400" y="361" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">dwd_fact_sales</text>
  <text x="400" y="377" font-size="8.5" fill="#475569" text-anchor="middle">row_hash PK（幂等去重键）· 288 行</text>
  <text x="400" y="390" font-size="8.5" fill="#475569" text-anchor="middle">dt_utc + dt_local 双列（UTC → Asia/Shanghai）</text>
  <text x="400" y="406" font-size="8.5" fill="#059669" text-anchor="middle">ingest_batch 可追溯、可回滚</text>

  <!-- ========== DWS ========== -->
  <rect x="36" y="464" width="632" height="104" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="656" y="482" font-size="9.5" fill="#d97706" text-anchor="end" font-weight="600">DWS 通用汇总层（无 ADS）</text>

  <rect x="220" y="488" width="240" height="66" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="340" y="507" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">dws_sales_daily</text>
  <text x="340" y="523" font-size="8.5" fill="#475569" text-anchor="middle">PK (dt_local, platform, tag_status)</text>
  <text x="340" y="538" font-size="8.5" fill="#d97706" text-anchor="middle">111 行 · total_sales / record_count</text>

  <!-- ========== APP ========== -->
  <rect x="36" y="600" width="632" height="120" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="656" y="618" font-size="9.5" fill="#7c3aed" text-anchor="end" font-weight="600">应用层（API 只读 DWS / DIM）</text>

  <rect x="48" y="628" width="150" height="56" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="123" y="650" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">GET /api/v1/</text>
  <text x="123" y="665" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">products</text>
  <text x="123" y="677" font-size="8" fill="#64748b" text-anchor="middle">打 dim_product</text>

  <rect x="214" y="628" width="170" height="56" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="299" y="650" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">GET /api/v1/</text>
  <text x="299" y="665" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">sales/trend</text>
  <text x="299" y="677" font-size="8" fill="#64748b" text-anchor="middle">打 dws_sales_daily</text>

  <rect x="396" y="628" width="90" height="56" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="441" y="655" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Q4 商品榜</text>
  <text x="441" y="673" font-size="8" fill="#64748b" text-anchor="middle">回查 DWD</text>

  <rect x="502" y="628" width="152" height="56" rx="6" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.3"/>
  <text x="578" y="655" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">GET /healthz</text>
  <text x="578" y="673" font-size="8" fill="#64748b" text-anchor="middle">COUNT(DWD)</text>

  <!-- ========== 连线 ========== -->
  <!-- 02_dwd_tag.sql：ODS → dim_product -->
  <path d="M 320 134 C 280 158, 160 168, 140 206" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar-blue)"/>
  <rect x="146" y="146" width="132" height="26" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="212" y="158" font-size="8.8" fill="#1d4ed8" text-anchor="middle" font-weight="700">02_dwd_tag.sql</text>
  <text x="212" y="168" font-size="7.8" fill="#64748b" text-anchor="middle">三段式打标 ODS→DIM</text>

  <!-- ingest.py：ODS → dwd_fact_sales（右侧绕行） -->
  <path d="M 430 106 L 676 106 L 676 370 L 550 370" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#ar-green)"/>
  <rect x="556" y="342" width="112" height="26" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
  <text x="612" y="354" font-size="8.8" fill="#047857" text-anchor="middle" font-weight="700">src/ingest.py</text>
  <text x="612" y="364" font-size="7.8" fill="#64748b" text-anchor="middle">归一化·去重·时区</text>

  <!-- 打标结果 JOIN：dim_product → DWS -->
  <path d="M 220 280 L 220 452 L 300 452 L 300 488" fill="none" stroke="#3b82f6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar-blue)"/>
  <text x="226" y="444" font-size="8" fill="#2563eb">标签结果 JOIN (product_id)</text>

  <!-- 03_dws_agg.sql：DWD → DWS -->
  <path d="M 400 416 L 400 488" fill="none" stroke="#d97706" stroke-width="2.2" marker-end="url(#ar-amber)"/>
  <rect x="372" y="440" width="120" height="22" rx="4" fill="#ffffff" stroke="#fde68a"/>
  <text x="432" y="455" font-size="8.8" fill="#b45309" text-anchor="middle" font-weight="700">03_dws_agg.sql</text>

  <!-- 04_queries.sql：DWS → trend -->
  <path d="M 330 554 L 330 628" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#ar-purple)"/>
  <rect x="306" y="578" width="118" height="22" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="365" y="593" font-size="8.8" fill="#6d28d9" text-anchor="middle" font-weight="700">04_queries.sql</text>

  <!-- 04_queries.sql：dim_product → products（左侧绕行） -->
  <path d="M 48 250 L 18 250 L 18 656 L 48 656" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5 3" marker-end="url(#ar-purple)"/>
  <text x="16" y="470" font-size="7.8" fill="#6d28d9" transform="rotate(-90 16 470)" text-anchor="middle">04_queries.sql 维表查询</text>

  <!-- Q4 回查 DWD（有理由的破例） -->
  <path d="M 470 416 L 470 628" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ar-gray)"/>
  <text x="476" y="500" font-size="7.8" fill="#64748b">Q4 回查明细</text>

  <!-- healthz：DWD → healthz -->
  <path d="M 550 395 C 610 430, 600 560, 600 628" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 4" marker-end="url(#ar-gray)"/>
  <text x="606" y="530" font-size="7.8" fill="#64748b">COUNT(*)</text>

  <!-- ========== 图例 ========== -->
  <rect x="36" y="736" width="632" height="52" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <line x1="48" y1="752" x2="76" y2="752" stroke="#2563eb" stroke-width="1.8"/><text x="82" y="755" font-size="8.5" fill="#334155">02_dwd_tag.sql 打标</text>
  <line x1="182" y1="752" x2="210" y2="752" stroke="#059669" stroke-width="1.8"/><text x="216" y="755" font-size="8.5" fill="#334155">src/ingest.py 入仓</text>
  <line x1="318" y1="752" x2="346" y2="752" stroke="#d97706" stroke-width="2.2"/><text x="352" y="755" font-size="8.5" fill="#334155">03_dws_agg.sql 汇总</text>
  <line x1="462" y1="752" x2="490" y2="752" stroke="#7c3aed" stroke-width="1.8"/><text x="496" y="755" font-size="8.5" fill="#334155">04_queries.sql 查询</text>
  <line x1="592" y1="752" x2="620" y2="752" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 4"/><text x="626" y="755" font-size="8.5" fill="#334155">回查/探针</text>
  <text x="48" y="776" font-size="8.5" fill="#64748b">要点：DWS 是 API 唯一的在线数据源；Q4 因需要商品粒度才回查 DWD；dq_report 属审计元数据，不参与分层。</text>
</svg>
